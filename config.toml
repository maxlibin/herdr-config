onboarding = false

[theme]
name = "gruvbox"
auto_switch = false

[ui]
status_indicators = "symbols"
tab_bar_position = "bottom"
tab_bar_right = [
  { type = "command", command = "~/.config/herdr/git-sidebar.sh", interval_seconds = 5, timeout_seconds = 4 },
  { type = "command", command = "~/.config/herdr/git-status.sh", interval_seconds = 3, timeout_seconds = 2 },
  { type = "command", command = "~/.config/herdr/ai-usage.sh", interval_seconds = 120, timeout_seconds = 40 },
  { type = "command", command = "~/.config/herdr/next-event/next-event", interval_seconds = 60, timeout_seconds = 10 },
  { type = "command", command = "~/.config/herdr/memory.sh", interval_seconds = 5, timeout_seconds = 2 },
  { type = "command", command = "~/.config/herdr/cpu.sh", interval_seconds = 5, timeout_seconds = 3 },
]
tab_bar_right_separator = " │ "

[ui.sidebar.agents]
rows = [
  ["state_icon", "machine", "workspace", "tab"],
  ["agent"],
  [
    { token = "$git_clean", fg = "#b8bb26" },
    { token = "$git_dirty", fg = "#fabd2f" },
    { token = "$git_behind", fg = "#fb4934" },
    { token = "$git", dim = true },
  ],
]

[ui.toast]
delivery = "herdr"
